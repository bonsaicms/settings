name: tests

on: push

jobs:
    test:
        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
                laravel: ['12', '13']
                include:
                    - laravel: '12'
                      testbench: '10.*'
                    - laravel: '13'
                      testbench: '11.*'

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, pdo, pdo_sqlite, sqlite3
                  coverage: none

            - name: Locate composer cache
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer packages
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

            - name: Install dependencies
              run: >
                  composer update --prefer-dist --no-interaction --no-progress
                  --with-all-dependencies
                  --with="laravel/framework:${{ matrix.laravel }}.*"
                  --with="orchestra/testbench:${{ matrix.testbench }}"

            - name: Run tests
              run: composer test
